modules:
  webtrigger:
    - key: peer-event
      function: event
      urlFormat: v2
      request:
        authentication: none
      response:
        type: dynamic
    - key: config-rpc
      function: rpc
      urlFormat: v2
      request:
        authentication: none
      response:
        type: dynamic
  function:
    - key: event
      handler: index.runEvent
    - key: rpc
      handler: index.runRpc
    - key: adminResolver
      handler: index.adminResolver
    - key: automationPing
      handler: index.runAutomationPing
    - key: automationConfig
      handler: index.automationResolver
    - key: onInstalled
      handler: index.onInstalled
    - key: onUpgraded
      handler: index.onUpgraded
    - key: onPreUninstall
      handler: index.onPreUninstall
  automation:actionProvider:
    - key: ping-actions
      actions:
        - send-ping
  action:
    - key: send-ping
      name: Send ping to peer
      description: Send a ping to the selected peer connection
      actionVerb: TRIGGER
      function: automationPing
      config:
        resource: automation-config
        render: native
      inputs:
        connectionId:
          title: Connection
          type: string
          required: true
          description: Stable ID of the configured peer connection
      resolver:
        function: automationConfig
  jira:adminPage:
    - key: configure-connections
      title: Configure connections
      resource: configure-ui
      render: native
      resolver:
        function: adminResolver
      useAsConfig: true
    - key: status
      title: Status
      resource: status-ui
      render: native
      resolver:
        function: adminResolver
    - key: get-started
      title: Get Started
      resource: get-started-ui
      render: native
      resolver:
        function: adminResolver
      useAsGetStarted: true
  trigger:
    - key: on-installed
      events:
        - avi:forge:installed:app
      function: onInstalled
    - key: on-upgraded
      events:
        - avi:forge:upgraded:app
      function: onUpgraded
  preUninstall:
    - key: on-pre-uninstall
      function: onPreUninstall
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/5e307f3a-16fb-45b0-b459-6bea666cd5ed
permissions:
  scopes:
    - read:jira-work
    - storage:app
  external:
    fetch:
      backend:
        - "*"
resources:
  - key: automation-config
    path: src/automation-config.tsx
  - key: configure-ui
    path: src/configure.tsx
  - key: status-ui
    path: src/status.tsx
  - key: get-started-ui
    path: src/get-started.tsx
