modules:
  webtrigger:
    - key: peer-event
      function: event
      urlFormat: v2
      request:
        authentication: none
      response:
        type: dynamic
    - key: config-rpc
      function: rpc
      urlFormat: v2
      request:
        authentication: none
      response:
        type: dynamic
  function:
    - key: event
      handler: index.runEvent
    - key: rpc
      handler: index.runRpc
    - key: adminResolver
      handler: index.adminResolver
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/5e307f3a-16fb-45b0-b459-6bea666cd5ed
permissions:
  scopes:
    - read:jira-work
    - storage:app
  external:
    fetch:
      backend:
        - "*"
